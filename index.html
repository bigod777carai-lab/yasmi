<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Yasmi — música escura e intensidade sonora.">
  <title>Yasmi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Abrir menu">
        <span></span><span></span>
      </button>
      <div class="brand">YASMI</div>
      <button class="avatar" type="button" aria-label="Abrir perfil">Y</button>
    </header>

    <section class="hero" aria-label="Destaque principal">
      <div class="grain"></div>
      <div class="orb orb-one"></div>
      <div class="orb orb-two"></div>
      <p class="eyebrow">MÚSICA SEM LIMITES</p>
      <h1><span>DARK</span><strong>SAD</strong></h1>
      <p class="subtitle">No silêncio, nós gritamos.</p>
      <button class="listen-button" id="listenButton" type="button">
        <span class="play-icon">▶</span>
        <span>OUVIR AGORA</span>
      </button>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Para você</h2>
        <button type="button">Ver tudo</button>
      </div>
      <div class="cards">
        <article class="card card-red">
          <div class="cover">
            <span>DS</span>
          </div>
          <h3>Dark Sessions</h3>
          <p>Sombras e frequência</p>
        </article>
        <article class="card card-gray">
          <div class="cover">
            <span>NS</span>
          </div>
          <h3>Night Signals</h3>
          <p>Enquanto o mundo dorme</p>
        </article>
      </div>
    </section>

    <nav class="tabbar" aria-label="Navegação principal">
      <button class="active" type="button" aria-label="Início"><span>⌂</span><small>Início</small></button>
      <button type="button" aria-label="Buscar"><span>⌕</span><small>Buscar</small></button>
      <button type="button" aria-label="Biblioteca"><span>▤</span><small>Biblioteca</small></button>
    </nav>
  </main>
  <script src="script.js"></script>
</body>
</html>
